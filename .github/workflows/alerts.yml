name: Market Alerts

on:
  schedule:
    # Every 2 hours during approximate US market hours (CEST)
    - cron: '0 14,16,18,20,22 * * 1-5'   # 14:00 - 22:00 CEST weekdays

    # Every 4 hours outside market hours
    - cron: '0 0,4,8,12 * * *'           # 00:00, 04:00, 08:00, 12:00 every day

  workflow_dispatch:

jobs:
  alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run alerts
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
        run: python alerts.py
